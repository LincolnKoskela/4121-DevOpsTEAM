apiVersion: v1
kind: Pod
metadata:
  name: incidentcmd-pod

spec:
  containers:

    # Backend API
    - name: api
      image: localhost/incidentcmd-api:latest
      ports:
        - containerPort: 3000
          hostPort: 3001
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

    # Runbook Automation Service
    - name: runbook
      image: localhost/incidentcmd-runbook:latest
      ports:
        - containerPort: 5000
          hostPort: 5000
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false

    # War Room Frontend
    - name: frontend
      image: localhost/incidentcmd-frontend:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
