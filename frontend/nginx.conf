server {
    listen 127.0.0.1:8081;

    root /usr/share/nginx/html;
    index index.html;

    # Node.js Incident API
    location /api/incidents {
        proxy_pass http://127.0.0.1:3100/incidents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node.js Alert Feed API
    location = /api/alerts {
        proxy_pass http://127.0.0.1:3100/alerts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python FastAPI Runbook Service
    location /api/runbooks {
        proxy_pass http://127.0.0.1:5100/runbooks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React application
    location / {
        try_files $uri $uri/ /index.html;
    }
}
