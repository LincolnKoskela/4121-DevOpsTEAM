name: Test Snyk Secret

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check Snyk token availability
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SUCCESS: Snyk token is available"
          else
            echo "FAILURE: Snyk token is missing"
            exit 1
          fi
