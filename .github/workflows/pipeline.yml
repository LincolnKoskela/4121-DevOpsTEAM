# .github/workflows/pipeline.yml
name: IncidentCommand Pipeline
on: [push, pull_request]
 
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && npm install && npm run lint
 
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with: { config: auto }            # warn only in S0-S1
      - run: pip install bandit && bandit -r services/ -l || true
 
  build:
    runs-on: ubuntu-latest
    needs: [lint, sast]
    steps:
      - uses: actions/checkout@v4
      - run: podman build -t incidentcmd-api ./backend
      - run: podman build -t incidentcmd-runbook ./services/runbook
      - run: podman build -t incidentcmd-frontend ./frontend
 
  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: trivy image incidentcmd-api   --exit-code 0   # warn S0-S2
      - run: trivy image incidentcmd-runbook --exit-code 0
 
  policy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: checkov -d infra/ --soft-fail   # warn S0-S3
 
  deploy:
    runs-on: ubuntu-latest
    needs: [scan, policy]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy step — implement in Sprint 2"
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: IncidentCommand
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 9
            --disableOssIndex

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: reports/
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk
        run: npm install -g snyk

      - name: Scan backend dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=backend/package.json --severity-threshold=critical

      - name: Scan Python runbook dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=services/runbook/requirements.txt --package-manager=pip --severity-threshold=critical
