# .github/workflows/pipeline.yml
name: IncidentCommand Pipeline
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd backend && npm install && npm run lint

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with: { config: auto }            # warn only in S0-S1
      - run: pip install bandit && bandit -r services/ -l || true

  build:
    runs-on: ubuntu-latest
    needs: [lint, sast]
    steps:
      - uses: actions/checkout@v4
      - run: podman build -t incidentcmd-api ./backend
      - run: podman build -t incidentcmd-runbook ./services/runbook
      - run: podman build -t incidentcmd-frontend ./frontend
  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t incidentcmd-api:latest ./backend

      - name: Build runbook image
        run: docker build -t incidentcmd-runbook:latest ./services/runbook

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: incidentcmd-api:latest
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Scan runbook image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: incidentcmd-runbook:latest
          severity: CRITICAL,HIGH
          exit-code: '0'
  policy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov
        run: checkov -d infra/ --soft-fail
  deploy:
    runs-on: ubuntu-latest
    needs: [scan, policy]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy step — implement in Sprint 2"
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: IncidentCommand
          path: .
          format: HTML
          out: reports
          args: >
            --failOnCVSS 9
            --disableOssIndex

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: reports/
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk
        run: npm install -g snyk
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Scan backend dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=backend/package.json --severity-threshold=critical
      - name: Install Python dependencies
        run: python3 -m pip install -r services/runbook/requirements.txt
      - name: Scan Python runbook dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=services/runbook/requirements.txt --package-manager=pip --severity-threshold=critical
